# Checks that a pull request from an outside contributor carries the
# Contributor License Agreement sentence (CLA.md) in its description. The
# pull request itself is the signed record.
#
# It runs on pull_request, so a fork gets a read-only token and no secrets,
# and it checks out no code: it reads only the event's own description.
name: CLA

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Look for the CLA sentence
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$AUTHOR" in
            sgnd | 'dependabot[bot]') echo "no CLA needed for $AUTHOR"; exit 0 ;;
          esac
          if printf '%s' "$BODY" | grep -Fq 'I have read the CLA Document and I hereby sign the CLA'; then
            echo "CLA signed by $AUTHOR in this pull request"
          else
            echo "::error::Add this line to the pull request description: I have read the CLA Document and I hereby sign the CLA"
            exit 1
          fi
