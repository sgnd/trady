# Push a tag like v0.0.1 and this runs every check, then publishes the
# release: an archive per platform, checksums.txt and build provenance.
# install.sh checks each download against checksums.txt.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # create the release
      id-token: write     # sign the build provenance (Sigstore)
      attestations: write # store it on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Write the release notes from CHANGELOG.md
        run: |
          awk -v h="## $GITHUB_REF_NAME " 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md | sed '/./,$!d' >notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section ## $GITHUB_REF_NAME"; exit 1; }
          cat >>notes.md <<'NOTES'

          Install or update:

          ```sh
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/sgnd/trady/main/install.sh | sh
          ```

          Check a download: `gh attestation verify FILE --repo sgnd/trady`
          NOTES
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
