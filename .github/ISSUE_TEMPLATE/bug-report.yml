name: Bug report
description: A trady command did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please write in English. Remove secrets and personal media paths before you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The trady command you ran, and its output. An AI agent can paste this for you.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: trady version
      description: Run `trady version`
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Your computer's OS
      placeholder: macOS 15.5, Ubuntu 24.04, Windows 11 with WSL
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: ffmpeg / ffprobe (if it matters)
      description: Output of `ffmpeg -version` / `ffprobe -version` first lines, or "not installed"
      placeholder: ffmpeg 7.x, not installed
